[package]
name = "speccursor-rust-worker"
version = "0.1.0"
edition = "2021"
authors = ["SpecCursor Team"]
description = "Rust Worker Pool for SpecCursor - executes ecosystem-specific upgrades"
license = "MIT"
repository = "https://github.com/speccursor/speccursor"
keywords = ["worker", "upgrades", "ecosystem", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pin below actix-web 4.10+ so builds work on rustc 1.85 (common Docker Desktop rustup).
actix-web = "=4.9.0"
actix-rt = "=2.10.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "speccursor-rust-worker"
path = "src/main.rs"

[lib]
name = "speccursor_rust_worker"
path = "src/lib.rs"
