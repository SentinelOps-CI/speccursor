# Chaos Mesh targets pods with label app=speccursor-worker.
# Two replicas so mode:one pod-failure leaves a survivor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: speccursor
  labels:
    app: speccursor-worker
    app.kubernetes.io/name: rust-worker
    app.kubernetes.io/part-of: speccursor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: speccursor-worker
  template:
    metadata:
      labels:
        app: speccursor-worker
        app.kubernetes.io/name: rust-worker
        app.kubernetes.io/part-of: speccursor
    spec:
      containers:
        - name: worker
          image: speccursor-worker:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: speccursor
  labels:
    app: speccursor-worker
    app.kubernetes.io/part-of: speccursor
spec:
  type: NodePort
  selector:
    app: speccursor-worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30088
