apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: speccursor
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: speccursor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: speccursor
    spec:
      containers:
        - name: ai-service
          image: speccursor-ai-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - secretRef:
                name: speccursor-secrets
          env:
            - name: APP_ENV
              value: staging
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3002'
            - name: DB_SSL
              value: 'false'
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: speccursor
  labels:
    app: ai-service
    app.kubernetes.io/part-of: speccursor
spec:
  type: NodePort
  selector:
    app: ai-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      nodePort: 30002
